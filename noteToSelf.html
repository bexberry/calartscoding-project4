<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Note to Self</title>
<style>
  :root {
    --bg: #f3efe6;
    --fg: #1d1d1d;
    --font: Georgia, serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--bg); color: var(--fg);
  }
  :root { background: var(--bg); }
  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: flex; }

  /* input screen */
  #ask { flex-direction: column; justify-content: center; align-items: center; gap: 1.5rem; padding: 2rem; text-align: center; }
  #ask label { font: 700 clamp(1.6rem, 6vw, 3rem)/1.1 var(--font); }
  #ask input {
    width: min(100%, 34rem); font: inherit; font-size: clamp(1.2rem, 4vw, 1.8rem);
    padding: .6rem .2rem; text-align: center; color: var(--fg);
    background: transparent; border: 0; border-bottom: 3px solid var(--fg); border-radius: 0; outline: none;
  }
  #ask input::placeholder { color: var(--fg); opacity: .45; }
  #ask input:focus-visible { border-bottom-width: 6px; }

  /* shared buttons */
  button {
    font: 600 1rem/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--fg); background: transparent; cursor: pointer;
    border: 2px solid var(--fg); border-radius: 999px; padding: .85rem 1.4rem;
  }
  button:hover { background: var(--fg); color: var(--bg); }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }

  /* display screen */
  #show { flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 3vmin 4vmin 0; overflow: hidden; }
  #mantra {
    width: 100%; text-align: center; line-height: 1.02;
    overflow-wrap: break-word; word-break: normal; hyphens: auto; text-wrap: balance;
    font-family: var(--font);
  }
  #bar { display: flex; justify-content: center; gap: .75rem; padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom, 0px)); }
</style>
</head>
<body>

<div id="ask" class="screen">
  <label for="m">Note to self:</label>
  <input id="m" type="text" maxlength="200" autocomplete="off" placeholder="Type it here">
  <button id="go" type="button">submit</button>
</div>

<div id="show" class="screen">
  <div id="stage"><div id="mantra"></div></div>
  <div id="bar">
    <button id="again" type="button">again</button>
    <button id="fresh" type="button">new note</button>
  </div>
</div>

<script>
(function () {
  var KEY = "mantra";
  var mantra = "";               // the saved string

  var FONTS = [
    { n: "Anton", f: "Impact, sans-serif" },
    { n: "Bebas Neue", f: "Impact, sans-serif" },
    { n: "Playfair Display", p: ":ital,wght@1,900", f: "Georgia, serif" },
    { n: "DM Serif Display", f: "Georgia, serif" },
    { n: "Abril Fatface", f: "Georgia, serif" },
    { n: "Shrikhand", f: "Georgia, serif" },
    { n: "Pacifico", f: "cursive" },
    { n: "Lobster", f: "cursive" },
    { n: "Caveat", p: ":wght@700", f: "cursive" },
    { n: "Permanent Marker", f: "cursive" },
    { n: "Righteous", f: "system-ui, sans-serif" },
    { n: "Fredoka", p: ":wght@700", f: "system-ui, sans-serif" },
    { n: "Space Grotesk", p: ":wght@700", f: "system-ui, sans-serif" },
    { n: "Rubik Mono One", f: "system-ui, sans-serif" }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var rand = function (a, b) { return a + Math.random() * (b - a); };
  var pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };

  function load() { try { return sessionStorage.getItem(KEY) || ""; } catch (e) { return ""; } }
  function save(v) { try { sessionStorage.setItem(KEY, v); } catch (e) {} }
  function clear() { try { sessionStorage.removeItem(KEY); } catch (e) {} }

  function colors() {
    var h = rand(0, 360), dark = Math.random() < 0.5;
    var h2 = (h + rand(130, 230)) % 360;
    var bg = "hsl(" + h + "," + rand(50, 90) + "%," + (dark ? rand(9, 22) : rand(80, 92)) + "%)";
    var fg = "hsl(" + h2 + "," + rand(70, 100) + "%," + (dark ? rand(66, 82) : rand(20, 34)) + "%)";
    return { bg: bg, fg: fg };
  }

  function loadFont(font) {
    var id = "gf-" + font.n.replace(/\s/g, "");
    if (!document.getElementById(id)) {
      var l = document.createElement("link");
      l.id = id; l.rel = "stylesheet";
      l.href = "https://fonts.googleapis.com/css2?family=" + font.n.replace(/ /g, "+") + (font.p || "") + "&display=swap";
      document.head.appendChild(l);
    }
    var spec = "700 40px \"" + font.n + "\"";
    var loading = document.fonts.load(spec);
    loading.then(function () { if (mantra) fit(); }, function () {});
    return Promise.race([
      loading,
      new Promise(function (r) { setTimeout(r, 2500); })
    ]).catch(function () {});
  }

  function fit() {
    var stage = $("stage"), el = $("mantra");
    var cs = getComputedStyle(stage);
    var w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var h = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var lo = 8, hi = 2000;
    while (hi - lo > 1) {
      var mid = (lo + hi) >> 1;
      el.style.fontSize = mid + "px";
      if (el.scrollWidth <= w + 1 && el.scrollHeight <= h) lo = mid; else hi = mid;
    }
    el.style.fontSize = lo + "px";
  }

  function paint() {
    var c = colors(), font = pick(FONTS), root = document.documentElement;
    root.style.setProperty("--bg", c.bg);
    root.style.setProperty("--fg", c.fg);
    root.style.setProperty("--font", "\"" + font.n + "\", " + font.f);
    document.querySelector('meta[name="theme-color"]').setAttribute("content", c.bg);
    var el = $("mantra");
    el.style.fontWeight = font.p && font.p.indexOf("wght") > -1 ? 700 : 400;
    el.style.fontStyle = font.p && font.p.indexOf("ital") > -1 ? "italic" : "normal";
    fit();
    return loadFont(font).then(fit);
  }

  function showAsk() {
    $("show").classList.remove("on");
    $("ask").classList.add("on");
    var c = colors(), font = pick(FONTS), root = document.documentElement;
    root.style.setProperty("--bg", c.bg);
    root.style.setProperty("--fg", c.fg);
    root.style.setProperty("--font", "\"" + font.n + "\", " + font.f);
    loadFont(font);
    $("m").value = "";
    $("m").focus();
  }

  function showMantra() {
    $("ask").classList.remove("on");
    $("show").classList.add("on");
    $("mantra").textContent = mantra;
    paint();
  }

  function submit() {
    var v = $("m").value.replace(/\s+/g, " ").trim();
    if (!v) { $("m").focus(); return; }
    mantra = v;
    save(mantra);
    showMantra();
  }

  $("go").addEventListener("click", submit);
  $("m").addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
  $("again").addEventListener("click", paint);
  $("fresh").addEventListener("click", function () { mantra = ""; clear(); showAsk(); });
  window.addEventListener("resize", function () { if (mantra) fit(); });

  mantra = load();
  if (mantra) showMantra(); else showAsk();
})();
</script>
</body>
</html>
